server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    # Встроенный DNS docker/podman. Без него nginx резолвит имя `web`
    # один раз при старте и после пересоздания контейнера продолжает
    # долбиться в старый IP, отдавая 502.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $upstream http://web:8000;

    # Статику отдаёт whitenoise внутри приложения: она уже сжата и
    # версионирована манифестом, дублировать раздачу здесь незачем.
    location / {
        # $request_uri обязателен: с переменной в proxy_pass nginx не
        # подставляет путь автоматически.
        proxy_pass $upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Загруженные файлы: фото докладчиков, PDF аннотаций.
    # nosniff обязателен — это пользовательский контент.
    location /media/ {
        alias /srv/media/;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Disposition "inline" always;
        expires 30d;
    }

    location = /healthz {
        proxy_pass $upstream$request_uri;
        proxy_set_header Host $host;
        access_log off;
    }
}
